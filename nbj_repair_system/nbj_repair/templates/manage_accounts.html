{% extends "base.html" %}

{% block title %}Manage Accounts — NBJ{% endblock %}

{% block content %}
<style>
    :root {
        --bg-super-dark: #050505;
        --card-bg: #0a0a0a;
        --accent-red: #ff3131;
        --text-bright: #ffffff;
        --text-dim: #777777;
        --border-thin: rgba(255, 255, 255, 0.05);
    }

    body, .main { background-color: var(--bg-super-dark) !important; }

    .card { background: var(--card-bg); border: 1px solid var(--border-thin); border-radius: 16px; padding: 30px; margin-bottom: 30px; }
    .card-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
    .card-title i { color: var(--accent-red); }

    /* Form Styling */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; align-items: end; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
    input { 
        background: #111; border: 1px solid var(--border-thin); border-radius: 8px; 
        padding: 12px; color: #fff; font-size: 0.9rem; transition: 0.3s;
    }
    input:focus { outline: none; border-color: var(--accent-red); background: #151515; }

    /* Table Styling */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 15px; color: var(--text-dim); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 2px solid var(--border-thin); text-align: left; }
    td { padding: 18px 15px; border-bottom: 1px solid var(--border-thin); color: #d1d1d1; font-size: 0.88rem; }

    .btn-primary { background: var(--accent-red); color: #fff; padding: 12px 24px; border-radius: 8px; border: none; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,49,49,0.3); }
    
    .btn-delete { background: transparent; border: 1px solid rgba(255, 49, 49, 0.2); color: var(--accent-red); padding: 6px 12px; border-radius: 6px; font-size: 0.65rem; cursor: pointer; text-transform: uppercase; font-weight: 700; }
    .btn-delete:hover { background: var(--accent-red); color: #fff; }
</style>

<div class="card">
    <div class="card-title"><i class="fas fa-user-plus"></i> Register New Customer Account</div>
    <form method="POST" action="/manage-accounts" class="form-grid">
        <input type="hidden" name="action" value="add">
        
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" name="full_name" placeholder="John Doe" required>
        </div>
        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="johndoe123" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn-primary">Create User</button>
    </form>
</div>

<div class="card">
    <div class="card-title"><i class="fas fa-users-cog"></i> Existing Customer Accounts</div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Customer Name</th>
                    <th>Username</th>
                    <th style="text-align: right;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for c in customers %}
                <tr>
                    <td><strong style="color: #fff;">{{ c.full_name }}</strong></td>
                    <td style="font-family: monospace; color: var(--text-dim);">@{{ c.username }}</td>
                    <td style="text-align: right;">
                        <form method="POST" action="/manage-accounts" style="display:inline;">
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="user_id" value="{{ c.id }}">
                            <button type="submit" class="btn-delete" onclick="return confirm('Delete this account?')">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
